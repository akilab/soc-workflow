<body>

<header>
  <h1>分岐を横に並べる — 描画モック</h1>
  <select id="pick"></select>
  <label style="font-size:13px;color:var(--dim)">
    <input type="checkbox" id="stagger"> 帯の中で線をずらす
  </label>
  <label style="font-size:13px;color:var(--dim)">
    <input type="checkbox" id="bylane" checked> 枝を担当の並びで置く
  </label>
  <div class="stat">
    <span>列 <b id="nCols">-</b></span>
    <span>行 <b id="nRows">-</b></span>
    <span>線 <b id="nWires">-</b></span>
    <span id="cross">交差 <b>-</b></span>
  </div>
</header>

<p class="note">
  枝はいちばん左から順に並べる。同じ担当に 2 本以上が並ぶときは、その担当の列を割る。
  枝の長さが違っても、次の手順へは<b>それぞれの枝の最後から</b>線を引く。
  <b>交差は線分の総当たりで数えている</b>（端点を共有するものは除く）。赤い線と点が交差箇所。
</p>

<div class="wrap"><div class="grid" id="grid"><svg class="wires" id="wires"></svg></div></div>

<script>
var LANES = DATA.lanes, PHASES = {}, TASKS = {};
DATA.phases.forEach(function(p){ PHASES[p.key] = p; });
DATA.tasks.forEach(function(t){ TASKS[t.key] = t; });
var LANEBY = {}; LANES.forEach(function(l){ LANEBY[l.key] = l; });
var esc = function(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };

/* ---------------------------------------------------------------------------
   1. 手順の並びを「かたまり」に分ける。

   条件を持たない手順はそのまま 1 つのかたまり。条件を持つ手順が続くあいだは、
   同じ判断への答えごとにまとめて 1 つの分岐のかたまりにする。
   データの持ち方は変えていないので、ここは読み替えているだけ。
--------------------------------------------------------------------------- */
function blocksOf(ev){
  var out = [], i = 0, steps = ev.steps;
  while(i < steps.length){
    var cs = steps[i].conditions || [];
    if(!cs.length){ out.push({ type:"step", step:steps[i], index:i }); i++; continue; }

    var key = cs[0].key, order = [], byVal = {};
    while(i < steps.length){
      var c = (steps[i].conditions || [])[0];
      if(!c || c.key !== key) break;
      if(!byVal[c.value]){ byVal[c.value] = []; order.push(c.value); }
      byVal[c.value].push({ step:steps[i], index:i });
      i++;
    }
    /* 答えの並びは判断の選択肢の順にそろえる。データに出てきた順ではなく、
       設計した人が並べた順で左から右へ置きたい。 */
    var dec = null;
    for(var z=0; z<steps.length; z++)
      if(steps[z].decision && steps[z].decision.key === key) dec = steps[z].decision;
    if(dec){
      var sorted = [];
      dec.options.forEach(function(o){ if(byVal[o.value]) sorted.push(o.value); });
      order.forEach(function(v){ if(sorted.indexOf(v) < 0) sorted.push(v); });
      order = sorted;
    }
    /* 枝を置く順。既定は判断の選択肢の順（設計した人が並べた順）。
       「担当の並びで置く」を選ぶと、その枝がいちばん左で使う担当の順にする。
       枝の中で担当をまたぐ動きが、ほかの枝の線を横切らなくなる。 */
    if(document.getElementById("bylane") && document.getElementById("bylane").checked){
      var idx = {};
      LANES.forEach(function(l, n){ idx[l.key] = n; });
      order = order.slice().sort(function(a, b){
        var la = Math.min.apply(null, byVal[a].map(function(x){ return idx[x.step.lane]; }));
        var lb = Math.min.apply(null, byVal[b].map(function(x){ return idx[x.step.lane]; }));
        return la - lb;
      });
    }
    out.push({ type:"branch", key:key, dec:dec, order:order, byVal:byVal });
  }
  return out;
}

/* ---------------------------------------------------------------------------
   2. 列を決める。

   列は担当。ただし同じ担当に枝が 2 本以上並ぶときは、その担当の列を割る。
   割る数は「その担当に同時に並ぶ枝の最大数」。分岐の外にいる手順は、
   その担当の列を丸ごと使う（割れていても 1 つのボックスとして見える）。
--------------------------------------------------------------------------- */
function columnsOf(blocks){
  var need = {};
  LANES.forEach(function(l){ need[l.key] = 1; });

  blocks.forEach(function(b){
    if(b.type !== "branch") return;
    var used = {}; // lane -> 何本の枝がその担当を使っているか
    b.order.forEach(function(v){
      var seen = {};
      b.byVal[v].forEach(function(x){ seen[x.step.lane] = 1; });
      Object.keys(seen).forEach(function(lk){ used[lk] = (used[lk] || 0) + 1; });
    });
    Object.keys(used).forEach(function(lk){
      if(used[lk] > (need[lk] || 1)) need[lk] = used[lk];
    });
  });

  var base = {}, total = 0;
  LANES.forEach(function(l){ base[l.key] = total; total += need[l.key]; });
  return { need:need, base:base, total:total };
}

/* 分岐のかたまりの中で、枝ごと・担当ごとの小さい列を決める。 */
function slotsOf(b, cols){
  var slot = {}; // value -> lane -> 何番目の小列か
  var counter = {};
  b.order.forEach(function(v){
    slot[v] = {};
    var seen = {};
    b.byVal[v].forEach(function(x){ seen[x.step.lane] = 1; });
    Object.keys(seen).forEach(function(lk){
      var n = counter[lk] || 0;
      slot[v][lk] = Math.min(n, cols.need[lk] - 1);
      counter[lk] = n + 1;
    });
  });
  return slot;
}

/* ---------------------------------------------------------------------------
   3. 置く。行はかたまりの順、分岐は枝の長さの最大ぶんを取る。
--------------------------------------------------------------------------- */
function layout(ev){
  var blocks = blocksOf(ev), cols = columnsOf(blocks);
  var placed = [], row = 2, bands = [];

  blocks.forEach(function(b){
    if(b.type === "step"){
      var l = LANEBY[b.step.lane];
      placed.push({ step:b.step, index:b.index, row:row,
        col:cols.base[b.step.lane], span:cols.need[b.step.lane], lane:l,
        entry:true, exit:true, block:b });
      row++;
      return;
    }
    var slot = slotsOf(b, cols), start = row, height = 0;
    b.order.forEach(function(v){
      var list = b.byVal[v];
      if(list.length > height) height = list.length;
      list.forEach(function(x, k){
        var lk = x.step.lane;
        placed.push({ step:x.step, index:x.index, row:start + k,
          col:cols.base[lk] + (slot[v][lk] || 0), span:1, lane:LANEBY[lk],
          entry:k === 0, exit:k === list.length - 1, value:v, block:b });
      });
    });
    bands.push({ from:start, to:start + height - 1 });
    row = start + height;
  });

  return { blocks:blocks, cols:cols, placed:placed, rows:row - 1, bands:bands };
}

/* ---------------------------------------------------------------------------
   4. 描く。
--------------------------------------------------------------------------- */
var COLW = 200;
function render(ev){
  var L = layout(ev);
  var grid = document.getElementById("grid");
  grid.querySelectorAll(":scope > *:not(svg)").forEach(function(n){ n.remove(); });
  grid.style.gridTemplateColumns = "repeat(" + L.cols.total + ", minmax(" + COLW + "px, 1fr))";

  LANES.forEach(function(l){
    var bg = document.createElement("div");
    bg.className = "lane" + (L.cols.base[l.key] + L.cols.need[l.key] === L.cols.total ? " last" : "");
    bg.style.setProperty("--lc", l.color);
    bg.style.gridColumn = (L.cols.base[l.key] + 1) + " / span " + L.cols.need[l.key];
    bg.style.gridRow = "1 / " + (L.rows + 2);
    grid.appendChild(bg);

    var h = document.createElement("h3");
    h.className = "lane-h";
    h.style.setProperty("--lc", l.color);
    h.style.gridColumn = (L.cols.base[l.key] + 1) + " / span " + L.cols.need[l.key];
    h.textContent = l.name + (L.cols.need[l.key] > 1 ? "（" + L.cols.need[l.key] + " 列）" : "");
    grid.appendChild(h);
  });

  /* 分岐の帯。どこからどこまでが 1 つの分かれ道かを地色で示す。 */
  L.bands.forEach(function(b){
    var el = document.createElement("div");
    el.className = "band";
    el.style.gridColumn = "1 / span " + L.cols.total;
    el.style.gridRow = (b.from) + " / " + (b.to + 1);
    grid.appendChild(el);
  });

  var els = {};
  L.placed.forEach(function(p){
    var el = document.createElement("div");
    var ph = PHASES[(TASKS[p.step.task] || {}).phase];
    el.className = "node" + (p.step.decision ? " dec" : "");
    el.style.setProperty("--pc", ph ? ph.color : "#666");
    el.style.setProperty("--lc", p.lane ? p.lane.color : "#666");
    el.style.gridColumn = (p.col + 1) + " / span " + p.span;
    el.style.gridRow = p.row;
    var ans = "";
    if(p.value && p.block.dec){
      var opt = null;
      p.block.dec.options.forEach(function(o){ if(o.value === p.value) opt = o; });
      var color = ["#e3618a","#4a9be0","#9a76d8","#e0a03c","#3fc09a"][p.block.order.indexOf(p.value) % 5];
      ans = '<span class="ans" style="--bc:' + color + '">' + esc(opt ? opt.label : p.value) + "</span>";
    }
    el.innerHTML = '<span class="no">' + (p.index + 1) + "</span>"
      + "<b>" + esc(p.step.title) + "</b>"
      + ans
      + '<span class="who">' + esc(p.lane ? p.lane.name : "?") + "</span>";
    grid.appendChild(el);
    els[p.index] = el;
  });

  /* 置いてから測る。モックなので rAF ではなくタイマーで足りる。 */
  setTimeout(function(){ wires(L, els); }, 0);
}

/* かたまりどうしを繋ぐ。分岐へは判断から枝の数だけ分かれ、
   分岐からは枝の数だけ次の手順へ戻る。 */
function pairs(L){
  var out = [], prev = null;
  L.blocks.forEach(function(b){
    var entries = L.placed.filter(function(p){ return p.block === b && p.entry; });
    var exits = L.placed.filter(function(p){ return p.block === b && p.exit; });
    if(prev) prev.forEach(function(a){ entries.forEach(function(z){ out.push([a, z]); }); });
    prev = exits;
    /* 枝の中の並びも繋ぐ */
    if(b.type === "branch"){
      b.order.forEach(function(v){
        var list = L.placed.filter(function(p){ return p.block === b && p.value === v; })
          .sort(function(x, y){ return x.row - y.row; });
        for(var k = 0; k + 1 < list.length; k++) out.push([list[k], list[k + 1]]);
      });
    }
  });
  return out;
}

function wires(L, els){
  var svg = document.getElementById("wires");
  var grid = document.getElementById("grid");
  var box = grid.getBoundingClientRect();
  svg.setAttribute("viewBox", "0 0 " + grid.clientWidth + " " + grid.clientHeight);

  var stagger = document.getElementById("stagger").checked;
  var list = pairs(L), segs = [], d = [];

  list.forEach(function(pr, idx){
    var a = els[pr[0].index].getBoundingClientRect();
    var z = els[pr[1].index].getBoundingClientRect();
    var ax = a.left - box.left + a.width / 2, ay = a.bottom - box.top;
    var zx = z.left - box.left + z.width / 2, zy = z.top - box.top - 7;
    /* 同じ帯に何本も入るときは、横に走る高さをずらす。ずらさないと
       重なって 1 本に見え、交差しているのかどうかも分からない。 */
    var my = (ay + zy) / 2;
    if(stagger) my = ay + (zy - ay) * (0.35 + 0.3 * ((idx % 3) / 2));
    var pts = Math.abs(ax - zx) < 2 ? [[ax, ay], [zx, zy]]
      : [[ax, ay], [ax, my], [zx, my], [zx, zy]];
    for(var k = 0; k + 1 < pts.length; k++) segs.push({ a:pts[k], b:pts[k + 1], i:idx });
    d.push({ pts:pts, fork:pr[0].block !== pr[1].block });
  });

  /* 線分の総当たりで交差を数える。端点を共有するものは交差としない。 */
  var hits = [], bad = {};
  for(var i = 0; i < segs.length; i++)
    for(var j = i + 1; j < segs.length; j++){
      if(segs[i].i === segs[j].i) continue;
      var p = cross(segs[i], segs[j]);
      if(p){ hits.push(p); bad[segs[i].i] = 1; bad[segs[j].i] = 1; }
    }

  svg.innerHTML = d.map(function(x, i){
    var s = "M " + x.pts[0][0] + " " + x.pts[0][1];
    for(var k = 1; k < x.pts.length; k++) s += " L " + x.pts[k][0] + " " + x.pts[k][1];
    return '<path class="' + (bad[i] ? "hit" : (x.fork ? "fork" : "")) + '" d="' + s + '"/>';
  }).join("") + hits.map(function(p){
    return '<circle class="hit" cx="' + p[0] + '" cy="' + p[1] + '" r="5"/>';
  }).join("");

  document.getElementById("nCols").textContent = L.cols.total;
  document.getElementById("nRows").textContent = L.rows;
  document.getElementById("nWires").textContent = list.length;
  var c = document.getElementById("cross");
  c.className = hits.length ? "ng" : "ok";
  c.innerHTML = "交差 <b>" + hits.length + "</b>";
}

/* 2 つの線分が交わる点。端点を共有するだけのものは交差としない。 */
function cross(s, t){
  var p = s.a, r = [s.b[0] - s.a[0], s.b[1] - s.a[1]];
  var q = t.a, e = [t.b[0] - t.a[0], t.b[1] - t.a[1]];
  var rxs = r[0] * e[1] - r[1] * e[0];
  if(Math.abs(rxs) < 1e-9) return null; // 平行・重なりはここでは数えない
  var qp = [q[0] - p[0], q[1] - p[1]];
  var u = (qp[0] * r[1] - qp[1] * r[0]) / rxs;
  var v = (qp[0] * e[1] - qp[1] * e[0]) / rxs;
  var m = 0.02; // 端点どうしの接触は除く
  if(u <= m || u >= 1 - m || v <= m || v >= 1 - m) return null;
  return [p[0] + v * r[0], p[1] + v * r[1]];
}

var pick = document.getElementById("pick");
DATA.events.forEach(function(ev, i){
  var o = document.createElement("option");
  o.value = i; o.textContent = ev.title;
  pick.appendChild(o);
});
pick.addEventListener("change", function(){ render(DATA.events[pick.value]); });
document.getElementById("stagger").addEventListener("change", function(){
  render(DATA.events[pick.value]);
});
document.getElementById("bylane").addEventListener("change", function(){
  render(DATA.events[pick.value]);
});
render(DATA.events[0]);
</script>
