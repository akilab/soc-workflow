<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Workflow — エディタ（提案用モック）</title>

<!-- ==================================================================
     viewerCss — 「書き出される単一HTML」が使うスタイル。
     このモック自身の試走モードでも同じものを使い、
     エクスポート時は textContent を取り出してそのまま埋め込む。
     ================================================================== -->
<style id="viewerCss">
:root{
  --bg:#0a0c11; --panel:#12161e; --panel2:#181d27; --panel3:#1f2531;
  --line:#2b3242; --line-soft:#212734;
  --fg:#f0f3f8; --dim:#aab4c6; --faint:#7d8798;

  --cur:#ffc93c;  --cur-bg:rgba(255,201,60,.13);
  --ok:#3ddc97;   --ok-bg:rgba(61,220,151,.13);
  --skip:#6b7383;
  --s1:#ff6b6b;   --s2:#ffb02e;   --s3:#5ad1e6;
  --dec:#a97bff;

  /* フェーズ（カテゴリ）の色 — 列・ボックス・パレット・レーンで一貫して使う */
  --c1:#ff5c8a; --c2:#4aa8ff; --c3:#a97bff; --c4:#ffb02e; --c5:#2ee6a8; --c6:#5ad1e6;
  --c7:#ff8a4c; --c8:#8ce36b; --c9:#e36bd0; --c10:#7c8cff;

  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:"Meiryo UI","Hiragino Sans","Helvetica Neue","Noto Sans JP","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased}

.v-top{position:sticky;top:0;z-index:20;background:rgba(10,12,17,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;
  justify-content:space-between;gap:26px;flex-wrap:wrap}
.v-top h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap}
.v-top h1 b{color:var(--cur)}
.v-now{flex:1;min-width:240px;font-size:14px;color:var(--dim)}
.v-now b{color:var(--fg)}
.v-meters{display:flex;gap:26px;align-items:center}
.v-meter .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.v-meter .val{font-family:var(--mono);font-size:23px;line-height:1.25;font-weight:700}
.v-bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px;width:170px}
.v-bar i{display:block;height:100%;background:var(--ok);width:0%;transition:width .3s}

.v-main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;padding:18px 28px 0;align-items:start}
.v-main.solo{grid-template-columns:minmax(0,1fr)}
.v-main.solo .v-evs{display:none}
@media(max-width:1150px){.v-main{grid-template-columns:1fr}}

.v-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.v-card>h3{margin:0 0 11px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--faint);font-weight:700}

.v-ev{width:100%;text-align:left;background:var(--panel2);color:inherit;border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;margin-bottom:8px;cursor:pointer;font-family:var(--sans);
  display:flex;gap:10px;align-items:flex-start;transition:border-color .16s,background .16s}
.v-ev:hover{border-color:#404a5e;background:var(--panel3)}
.v-ev.on{border-color:var(--cur);background:var(--cur-bg)}
.v-ev.on b{color:var(--cur)}
.v-ev b{display:block;font-size:14px;font-weight:700;line-height:1.5}
.v-ev span.sub{display:block;font-size:12px;color:var(--dim);line-height:1.55;margin-top:2px}
.sev{flex:none;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;
  border-radius:4px;margin-top:2px;letter-spacing:.03em}
.sev.S1{background:rgba(255,107,107,.16);color:var(--s1);border:1px solid var(--s1)}
.sev.S2{background:rgba(255,176,46,.16);color:var(--s2);border:1px solid var(--s2)}
.sev.S3{background:rgba(90,209,230,.16);color:var(--s3);border:1px solid var(--s3)}

.v-stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px 22px;overflow-x:auto}
.v-grid{position:relative;display:flex;gap:46px;min-width:1330px;padding-bottom:104px}
.v-col{flex:1 1 0;min-width:178px;display:flex;flex-direction:column;gap:18px}
.v-col>h2{margin:0 0 6px;font-size:11px;letter-spacing:.13em;font-weight:700;white-space:nowrap;
  color:var(--pc,var(--faint));padding-bottom:6px;border-bottom:2px solid var(--pc,var(--line));opacity:.9}

/* フェーズ色は左のバーで常に見えるようにし、状態は枠線・地色・記号で示す。
   （色だけに頼らないという設計判断を守りつつ、カテゴリ色を消さない） */
.v-node{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--pc,var(--line));
  border-radius:8px;padding:10px 12px 10px 13px;cursor:pointer;position:relative;
  transition:opacity .18s,border-color .18s,background .18s,box-shadow .18s}
.v-node .n{font-size:13.5px;display:block;line-height:1.5;font-weight:600}
.v-node .t{font-size:11px;color:var(--faint);display:block;line-height:1.45;margin-top:2px}
.v-node .mk{position:absolute;top:8px;right:9px;font-family:var(--mono);font-size:12px;font-weight:700}
.v-node:hover{background:var(--panel3)}
.v-node.done{border-color:var(--ok);background:var(--ok-bg)}
.v-node.done .mk{color:var(--ok)}
.v-node.cur{border-color:var(--cur);background:var(--cur-bg);box-shadow:0 0 0 3px rgba(255,201,60,.18)}
.v-node.cur .mk{color:var(--cur)}
.v-node.skip{opacity:.32;border-style:dashed;background:transparent}
.v-node.skip .mk{color:var(--skip)}
.v-node .dec{position:absolute;bottom:7px;right:9px;font-size:11px;color:var(--dec)}

.v-wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.v-wires path.w{fill:none;stroke:var(--cur);stroke-width:2;opacity:.85;stroke-linecap:round}
.v-wires path.w.done{stroke:var(--ok)}
.v-wires path.w.pend{stroke:var(--faint);stroke-dasharray:5 4;opacity:.7}
.v-wires circle{fill:var(--bg);stroke:var(--cur);stroke-width:1.6}
.v-wires circle.done{stroke:var(--ok)} .v-wires circle.pend{stroke:var(--faint)}
.v-wires text{fill:var(--cur);font-family:var(--mono);font-size:11px;font-weight:700;
  text-anchor:middle;dominant-baseline:central}
.v-wires text.done{fill:var(--ok)} .v-wires text.pend{fill:var(--faint)}

.v-steps{margin:18px 28px 60px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:18px 22px 22px}
.v-steps>header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.v-steps h2{margin:0;font-size:18px}
.v-steps h2 small{display:block;font-size:13px;color:var(--dim);font-weight:400;margin-top:3px}
.v-acts{display:flex;gap:9px}
.v-btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;
  padding:8px 15px;font-size:13px;cursor:pointer;font-family:var(--sans)}
.v-btn:hover{border-color:#404a5e;background:var(--panel3)}
.v-btn.p{border-color:var(--ok);color:var(--ok)}

.v-s{display:flex;gap:14px;padding:15px 12px;border-top:1px solid var(--line-soft);
  border-radius:9px;transition:background .18s}
.v-s:first-of-type{border-top:none}
.v-s.current{background:var(--cur-bg);border-top-color:transparent;box-shadow:inset 4px 0 0 var(--cur)}
.v-s .chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);
  background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--faint);margin-top:2px}
.v-s .chk:hover{border-color:var(--cur);color:var(--cur)}
.v-s.current .chk{border-color:var(--cur);color:var(--cur)}
.v-s.done .chk{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.v-s .bd{flex:1;min-width:0}
.v-s .ttl{font-size:15.5px;font-weight:700;line-height:1.6}
.v-s.current .ttl{color:var(--cur)}
.v-s.done .ttl{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint)}
.v-s .path{font-size:12px;color:var(--faint);margin:2px 0 7px}
.v-s .path i{font-style:normal;color:var(--pc,var(--faint))}
.v-s .dsc{font-size:13.5px;color:var(--dim);line-height:1.85}
.v-s .dsc code{font-family:var(--mono);font-size:12.5px;background:var(--panel3);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--fg)}
.v-s.skipped{opacity:.34}
.v-s.skipped .ttl{text-decoration:line-through}

.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;
  margin-left:8px;vertical-align:middle;white-space:nowrap}
.tag.now{background:var(--cur);color:#1a1405;border:1px solid var(--cur)}
.tag.sla{background:var(--panel3);color:var(--dim);border:1px solid var(--line);font-family:var(--mono)}
.tag.esc{background:rgba(255,107,107,.16);color:var(--s1);border:1px solid var(--s1)}
.tag.cond{background:rgba(169,123,255,.16);color:#bfa0ff;border:1px solid var(--dec)}

.v-godone{margin-top:12px;background:var(--cur);border:none;color:#1a1405;border-radius:8px;
  padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.v-godone:hover{filter:brightness(1.08)}

.v-ask{margin-top:12px;padding:14px 16px;background:var(--panel2);border:2px solid var(--dec);border-radius:9px}
.v-ask p{margin:0 0 10px;font-size:14.5px;font-weight:700}
.v-ask .opts{display:flex;gap:10px;flex-wrap:wrap}
.v-ask button{background:var(--panel3);border:2px solid var(--line);color:var(--fg);border-radius:8px;
  padding:9px 18px;font-size:14px;cursor:pointer;font-family:var(--sans)}
.v-ask button:hover{border-color:var(--dec)}
.v-ask button.on{border-color:var(--dec);background:rgba(169,123,255,.22);color:#d5bfff;font-weight:700}

.v-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--dim)}
.v-legend span{display:flex;align-items:center;gap:6px}
.v-legend i{font-family:var(--mono);font-weight:700;font-size:13px;font-style:normal}
.v-note{margin:18px 0 0;font-size:12.5px;color:var(--faint);line-height:1.75}
.v-empty{color:var(--faint);font-size:14px;margin:18px 0 6px}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

<!-- ==================================================================
     editorCss — エディタ画面だけで使う。書き出しHTMLには含まれない。
     ================================================================== -->
<style id="editorCss">
/* ==================================================================
   editorCss — エディタ画面だけで使う。書き出しHTMLには含まれない。

   画面は 2 つ。
     事象ウィンドウ（body.screen-events） … 事象の一覧と作成
     編集ビュー    （body.screen-edit / .screen-run）

   編集ビューの配置:
     左   … 手順アウトライン（順序と分岐の木）
     中央 … 上＝フローキャンバス / 下＝タスクパレット（列を揃える）
     右   … インスペクタ
   ================================================================== */
#scEvents,#scEdit{display:none}
body.screen-events #scEvents{display:block}
body.screen-edit  #scEdit{display:flex;flex-direction:column;height:100vh;overflow:hidden}
body.screen-edit{overflow:hidden}
body.screen-run   #scEdit{display:block}
body.screen-edit  #runWrap{display:none}
body.screen-run   .ed-body{display:none}
body.resizing{cursor:col-resize;user-select:none}
body.resizing.rows{cursor:row-resize}

/* ---------- 共通の部品 ---------- */
.ed-spacer{flex:1}
.ed-tool{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;
  padding:7px 14px;font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ed-tool:hover{border-color:#404a5e;background:var(--panel3)}
.ed-tool.warn{border-color:var(--s2);color:var(--s2)}
.ed-tool.good{border-color:var(--ok);color:var(--ok)}
.ed-tool.pri{background:var(--ok);border-color:var(--ok);color:#04241a;font-weight:700}
.ed-tool.pri:hover{filter:brightness(1.08);background:var(--ok)}
.ed-tool.sm{padding:4px 9px;font-size:11.5px}
.ed-note{margin:16px 0 30px;font-size:12px;color:var(--faint);line-height:1.85}
.ed-note b{color:var(--dim)}

.brand{margin:0;font-size:16px;font-weight:700;white-space:nowrap;letter-spacing:.01em}
.brand b{color:var(--cur)}
.brand em{font-style:normal;font-size:10px;letter-spacing:.16em;color:var(--faint);
  border:1px solid var(--line);border-radius:4px;padding:2px 6px;margin-left:9px;vertical-align:2px}

/* ================= 事象ウィンドウ ================= */
.ew-top{position:sticky;top:0;z-index:30;background:rgba(10,12,17,.97);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:13px 30px;display:flex;align-items:center;gap:11px}
.ew-body{max-width:1360px;margin:0 auto;padding:26px 30px 40px}
.ew-h{margin:0 0 16px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);
  font-weight:700;display:flex;align-items:baseline;gap:10px}
.ew-h span{letter-spacing:0;text-transform:none;font-size:12px;font-weight:400}
.ew-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}

.ew-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px 13px;
  cursor:pointer;position:relative;transition:border-color .18s,background .18s,transform .18s,box-shadow .18s}
.ew-card:hover{border-color:var(--cur);background:var(--panel2);transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(0,0,0,.35)}
.ew-card .ew-hd{display:flex;gap:10px;align-items:flex-start;margin-bottom:5px}
.ew-card .ew-hd b{font-size:15.5px;font-weight:700;line-height:1.5;flex:1;min-width:0}
.ew-card:hover .ew-hd b{color:var(--cur)}
.ew-sub{margin:0 0 13px;font-size:12.5px;color:var(--dim);line-height:1.6;min-height:2.1em}

/* フェーズ分布 — どの段階に手順が集まっている事象かが一目で分かる */
.ew-bar{display:flex;gap:2px;height:7px;border-radius:4px;overflow:hidden;margin-bottom:7px;background:var(--panel3)}
.ew-bar i{display:block;height:100%}
.ew-dist{display:flex;flex-wrap:wrap;gap:9px;font-size:10.5px;color:var(--faint);margin-bottom:12px;
  font-family:var(--mono);min-height:1.4em}
.ew-dist span{display:flex;align-items:center;gap:4px}
.ew-dist i{width:7px;height:7px;border-radius:2px;flex:none}

.ew-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;font-family:var(--mono);
  padding-top:11px;border-top:1px solid var(--line-soft)}
.ew-meta span{border:1px solid var(--line);border-radius:5px;padding:2px 8px;color:var(--dim)}
.ew-meta span.ok{border-color:var(--ok);color:var(--ok)}
.ew-meta span.ng{border-color:var(--s2);color:var(--s2)}
.ew-acts{display:flex;gap:6px;margin-top:11px;opacity:0;transition:opacity .18s}
.ew-card:hover .ew-acts{opacity:1}
.ew-acts button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:6px;padding:5px 0;font-size:11.5px;cursor:pointer;font-family:var(--sans)}
.ew-acts button:hover{border-color:#404a5e;color:var(--fg)}
.ew-acts button.dg:hover{border-color:var(--s1);color:var(--s1)}

.ew-new{background:none;border:1px dashed var(--line);border-radius:12px;color:var(--faint);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
  min-height:190px;cursor:pointer;font-family:var(--sans);font-size:13px;transition:border-color .18s,color .18s}
.ew-new:hover{border-color:var(--ok);color:var(--ok)}
.ew-new u{text-decoration:none;font-size:26px;line-height:1}

/* ================= 編集ビュー ================= */
.ed-top{position:sticky;top:0;z-index:30;background:rgba(10,12,17,.97);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:13px;flex:none}
.ed-back{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;
  padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ed-back:hover{border-color:var(--cur);color:var(--cur)}
.ed-title{display:flex;align-items:center;gap:9px;min-width:0}
.ed-title b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-modes{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.ed-modes button{background:none;border:none;color:var(--dim);font-family:var(--sans);font-size:13px;
  padding:6px 17px;border-radius:6px;cursor:pointer;font-weight:600}
.ed-modes button.on{background:var(--cur);color:#1a1405;font-weight:700}

.ed-body{display:grid;grid-template-columns:var(--wl,262px) 7px minmax(0,1fr) 7px var(--wr,336px);
  gap:0;padding:12px 16px 14px;flex:1 1 auto;min-height:0}
.split{cursor:col-resize;position:relative}
.split.h{cursor:row-resize;height:7px}
.split::after{content:"";position:absolute;inset:0;margin:auto;width:1px;height:36px;
  background:var(--line);border-radius:1px;transition:background .15s}
.split.h::after{width:36px;height:1px}
.split:hover::after{background:var(--cur)}

.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;height:100%;
  display:flex;flex-direction:column;overflow:hidden;min-height:0}
.pane>h3{margin:0;padding:11px 14px 9px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--faint);font-weight:700;border-bottom:1px solid var(--line-soft);display:flex;
  justify-content:space-between;align-items:center;gap:8px;flex:none}
.pane>h3 span{letter-spacing:0;text-transform:none;font-size:11px;color:var(--faint);font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane .scroll{overflow:auto;flex:1;padding:10px 12px 16px;min-height:0}

/* ---------- 手順アウトライン（左） ---------- */
.ol-row{display:flex;gap:7px;align-items:flex-start;padding:6px 8px;border-radius:7px;cursor:grab;
  position:relative;transition:background .14s,box-shadow .14s;border-left:3px solid transparent}
.ol-row:hover{background:var(--panel2)}
.ol-row.sel{background:var(--cur-bg);box-shadow:inset 0 0 0 1px rgba(255,201,60,.4)}
.ol-row.drag{opacity:.35}
.ol-row.over{box-shadow:inset 0 2px 0 var(--cur)}
.ol-row.d1{margin-left:20px}
.ol-row.dec{border-left-color:var(--dec)}
.ol-no{flex:none;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--faint);
  min-width:16px;text-align:right;padding-top:2px}
.ol-row.sel .ol-no{color:var(--cur)}
.ol-pc{flex:none;width:7px;height:7px;border-radius:2px;background:var(--pc,var(--line));margin-top:6px}
.ol-t{flex:1;min-width:0;font-size:12.5px;line-height:1.5}
.ol-row.dec .ol-t::before{content:"\25C6";color:var(--dec);margin-right:5px;font-size:10px}
.ol-f{flex:none;display:flex;gap:4px;font-family:var(--mono);font-size:9.5px;padding-top:3px}
.ol-f .sla{color:var(--dim)} .ol-f .esc{color:var(--s1)}

.ol-grp{display:flex;gap:6px;align-items:center;margin:7px 0 3px 8px;padding:3px 9px 3px 7px;
  font-size:11px;font-weight:700;color:var(--oc);border-left:2px solid var(--oc);
  background:color-mix(in srgb, var(--oc) 9%, transparent);border-radius:0 6px 6px 0}
.ol-grp u{text-decoration:none;font-family:var(--mono);font-size:9.5px;opacity:.75;font-weight:400}
.ol-empty{color:var(--faint);font-size:12.5px;line-height:1.9;padding:14px 4px}
.ol-legend{margin-top:14px;padding-top:11px;border-top:1px solid var(--line-soft);
  font-size:10.5px;color:var(--faint);line-height:1.8}

/* ---------- キャンバス（中央・上） ---------- */

.ins .opt{display:flex;gap:6px;margin-bottom:6px;align-items:center}

.mask{position:fixed;inset:0;background:rgba(5,7,11,.82);backdrop-filter:blur(4px);z-index:80;

.ph-name{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);

.issue{display:flex;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;

</style>

    </div>

    <div class="pane">

<!-- ==================================================================
     viewerJs — 「書き出される単一HTML」の中身。
     エディタの試走モードでも、この同じ関数を呼んで描画する。
     エクスポート時は textContent をそのまま埋め込むため、
     このブロックは外部の変数を一切参照しないこと。
     ================================================================== -->
<script id="viewerJs">
function mountViewer(root, DATA, opt){
  opt = opt || {};
  var uid = "v" + Math.floor(Math.random()*1e9).toString(36);
  var phaseByKey = {}, taskByKey = {};
  DATA.phases.forEach(function(p){ phaseByKey[p.key] = p; });
  DATA.tasks.forEach(function(t){ taskByKey[t.key] = t; });

  var events = DATA.events;
  var solo = events.length < 2;

  root.innerHTML =
    '<div class="v-top">'
    + '<h1>SOC <b>対応フロー</b></h1>'
    + '<div class="v-now" data-e="now">左の一覧から、発生した事象を選択してください。</div>'
    + '<div class="v-meters">'
    +   '<div class="v-meter"><div class="k">経過時間</div><div class="val" data-e="elapsed">--:--</div></div>'
    +   '<div class="v-meter"><div class="k">進捗</div><div class="val" data-e="prog">0 / 0</div>'
    +     '<div class="v-bar"><i data-e="progbar"></i></div></div>'
    + '</div></div>'
    + '<div class="v-main' + (solo ? ' solo' : '') + '">'
    +   '<aside class="v-card v-evs"><h3>発生した事象</h3><div data-e="evlist"></div>'
    +     '<div class="v-legend">'
    +       '<span><i style="color:var(--cur)">&#9654;</i>現在</span>'
    +       '<span><i style="color:var(--ok)">&#10003;</i>完了</span>'
    +       '<span><i style="color:var(--skip)">&#8212;</i>対象外</span></div></aside>'
    +   '<div class="v-stage"><div class="v-grid" data-e="grid">'
    +     '<svg class="v-wires" data-e="wires"></svg></div></div>'
    + '</div>'
    + '<div class="v-steps"><header>'
    +   '<h2 data-e="stitle">対応手順<small>事象を選択してください</small></h2>'
    +   '<div class="v-acts"><button class="v-btn p" data-e="copy">作業ログをコピー</button>'
    +     '<button class="v-btn" data-e="reset">リセット</button></div></header>'
    +   '<div data-e="slist"><p class="v-empty">事象を選択してください。</p></div>'
    +   '<p class="v-note">' + (opt.note || "内容はダミーです。進捗はこのブラウザにのみ保存され、外部には送信されません。") + '</p>'
    + '</div>';

  function $(k){ return root.querySelector('[data-e="' + k + '"]'); }
  var grid = $("grid"), wires = $("wires");

  var cur = null, answers = {}, done = {}, startedAt = null, timer = null;
  var nodes = [];               // step index -> ボックス要素
  var KEY = opt.storageKey || "";

  function save(){
    if(!KEY) return;
    try{ localStorage.setItem(KEY, JSON.stringify({cur:cur, answers:answers, done:done, startedAt:startedAt})); }catch(e){}
  }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  /* 表示条件は AND。未回答の条件が残っていれば null（＝まだ分からない）。 */
  function visible(st){
    var cs = st.conditions || [];
    if(!cs.length) return true;
    var unknown = false;
    for(var i=0;i<cs.length;i++){
      var a = answers[cs[i].key];
      if(a === undefined){ unknown = true; continue; }
      if(a !== cs[i].value) return false;
    }
    return unknown ? null : true;
  }
  function currentIndex(ev){
    for(var i=0;i<ev.steps.length;i++){ if(visible(ev.steps[i]) !== false && !done[i]) return i; }
    return -1;
  }
  function findEvent(k){ for(var i=0;i<events.length;i++) if(events[i].key===k) return events[i]; return null; }

  /* ---- 事象リスト ---- */
  var evlist = $("evlist");
  events.forEach(function(ev){
    var b = document.createElement("button");
    b.className = "v-ev"; b.dataset.k = ev.key;
    b.innerHTML = '<span class="sev ' + ev.severity + '">' + ev.severity + '</span>'
      + '<span><b>' + esc(ev.title) + '</b><span class="sub">' + esc(ev.sub) + '</span></span>';
    b.addEventListener("click", function(){ select(ev.key); });
    evlist.appendChild(b);
  });

  /* ---- キャンバス（手順1つにつきボックス1つ） ---- */
  function buildGrid(ev){
    grid.innerHTML = "";
    nodes = [];
    grid.appendChild(wires);
    DATA.phases.forEach(function(p){
      var col = document.createElement("div");
      col.className = "v-col";
      col.style.setProperty("--pc", p.color);
      col.innerHTML = '<h2>' + esc(p.name) + '</h2>';
      ev.steps.forEach(function(st, i){
        var tk = taskByKey[st.task];
        if(!tk || tk.phase !== p.key) return;
        var el = document.createElement("div");
        el.className = "v-node";
        el.style.setProperty("--pc", p.color);
        el.innerHTML = '<span class="mk"></span><span class="n">' + esc(tk.label) + '</span>'
          + '<span class="t">' + esc(tk.note || "") + '</span>'
          + (st.decision ? '<span class="dec">&#9670;</span>' : '');
        el.addEventListener("click", function(){
          var rows = $("slist").querySelectorAll(".v-s");
          if(rows[i]) rows[i].scrollIntoView({behavior:"smooth", block:"center"});
        });
        col.appendChild(el);
        nodes[i] = el;
      });
      grid.appendChild(col);
    });
  }

  /* ---- 接続線 ---- */
  function ortho(pts, r){
    var d = "M " + pts[0][0] + " " + pts[0][1];
    for(var i=1;i<pts.length-1;i++){
      var px=pts[i-1][0], py=pts[i-1][1], cx=pts[i][0], cy=pts[i][1], nx=pts[i+1][0], ny=pts[i+1][1];
      var v1x=cx-px, v1y=cy-py, v2x=nx-cx, v2y=ny-cy;
      var l1=Math.hypot(v1x,v1y)||1, l2=Math.hypot(v2x,v2y)||1;
      var rr=Math.min(r, l1/2, l2/2);
      d += " L " + (cx-v1x/l1*rr) + " " + (cy-v1y/l1*rr);
      d += " Q " + cx + " " + cy + " " + (cx+v2x/l2*rr) + " " + (cy+v2y/l2*rr);
    }
    return d + " L " + pts[pts.length-1][0] + " " + pts[pts.length-1][1];
  }
  /* 同じ列の 2 ボックスの間に線を通せるすき間があれば、その y を返す */
  function gapLane(a, b, box){
    var ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    if(Math.abs(ra.left-rb.left) > 2) return null;
    var up = ra.top<rb.top?ra:rb, low = ra.top<rb.top?rb:ra;
    var gap = low.top - up.bottom;
    if(gap < 12) return null;
    var y = up.bottom + gap/2 - box.top;
    for(var i=0;i<nodes.length;i++){
      var el = nodes[i];
      if(!el || el===a || el===b) continue;
      var r = el.getBoundingClientRect();
      if(Math.abs(r.left-ra.left) > 2) continue;
      if(r.top-box.top < y && r.bottom-box.top > y) return null;
    }
    return y;
  }

  function paint(ev, ci){
    nodes.forEach(function(el){ if(el){ el.className="v-node"; el.querySelector(".mk").textContent=""; } });
    var box = grid.getBoundingClientRect();
    wires.setAttribute("viewBox", "0 0 " + grid.clientWidth + " " + grid.clientHeight);

    var seq = [];
    ev.steps.forEach(function(st, i){
      var el = nodes[i]; if(!el) return;
      var vis = visible(st), mk = el.querySelector(".mk");
      if(vis === false){ el.classList.add("skip"); mk.innerHTML = "&#8212;"; return; }
      if(done[i]){ el.classList.add("done"); mk.innerHTML = "&#10003;"; }
      else if(i === ci){ el.classList.add("cur"); mk.innerHTML = "&#9654;"; }
      seq.push({i:i, el:el, done:!!done[i], known:vis===true});
    });

    var maxBottom = 0;
    nodes.forEach(function(el){ if(el) maxBottom = Math.max(maxBottom, el.getBoundingClientRect().bottom - box.top); });

    var HEAD=7, OUT=26, IN=26, back=0;
    var out = '<defs>'
      + '<marker id="ah_'+uid+'" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="var(--cur)"/></marker>'
      + '<marker id="ahd_'+uid+'" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="var(--ok)"/></marker>'
      + '<marker id="ahp_'+uid+'" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="var(--faint)"/></marker>'
      + '</defs>';

    for(var k=0;k<seq.length-1;k++){
      var a = seq[k].el, b = seq[k+1].el;
      var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      /* 規則: 必ず右から出て、左から入る */
      var x1 = ra.right - box.left,        y1 = ra.top - box.top + ra.height/2;
      var x2 = rb.left - box.left - HEAD,  y2 = rb.top - box.top + rb.height/2;
      var d;
      if(x2 > x1 + 10){
        var dx = Math.max(26, (x2-x1)*0.45);
        d = "M " + x1 + " " + y1 + " C " + (x1+dx) + " " + y1 + ", " + (x2-dx) + " " + y2 + ", " + x2 + " " + y2;
      }else{
        var gx = Math.min(grid.clientWidth-6, x1+OUT);
        var hx = Math.max(-12, x2-IN);
        var gy = gapLane(a, b, box);
        if(gy !== null){
          d = ortho([[x1,y1],[gx,y1],[gx,gy],[hx,gy],[hx,y2],[x2,y2]], 9);
        }else{
          var ch = maxBottom + 22 + back*13; back++;
          d = ortho([[x1,y1],[gx,y1],[gx,ch],[hx,ch],[hx,y2],[x2,y2]], 11);
        }
      }
      /* 状態は色と線種の両方で示す（色だけに頼らない） */
      var st2 = seq[k].done && seq[k+1].done ? "done" : (seq[k].known && seq[k+1].known ? "" : "pend");
      var mk2 = st2==="done" ? "ahd_"+uid : (st2==="pend" ? "ahp_"+uid : "ah_"+uid);
      out += '<path class="w ' + st2 + '" d="' + d + '" marker-end="url(#' + mk2 + ')" />';

      var probe = document.createElementNS("http://www.w3.org/2000/svg","path");
      probe.setAttribute("d", d); wires.appendChild(probe);
      var pt = probe.getPointAtLength(probe.getTotalLength()/2);
      wires.removeChild(probe);
      out += '<circle class="' + st2 + '" cx="' + pt.x + '" cy="' + pt.y + '" r="10" />'
           + '<text class="' + st2 + '" x="' + pt.x + '" y="' + pt.y + '">' + (k+2) + '</text>';
    }
    wires.innerHTML = out;
  }

  function condLabel(ev, c){
    for(var i=0;i<ev.steps.length;i++){
      var d = ev.steps[i].decision;
      if(d && d.key === c.key){
        for(var j=0;j<d.options.length;j++) if(d.options[j].value===c.value) return d.options[j].label;
      }
    }
    return c.value;
  }

  function render(){
    var ev = findEvent(cur); if(!ev) return;
    var ci = currentIndex(ev);
    $("stitle").innerHTML = esc(ev.title) + '<small>' + esc(ev.sub) + '　—　重大度 ' + ev.severity + '</small>';
    $("now").innerHTML = ci>=0
      ? '次にやること: <b>' + esc(ev.steps[ci].title) + '</b>'
      : 'すべての手順が完了しました。';

    var list = $("slist"); list.innerHTML = "";
    var n = 0, total = 0, fin = 0;
    ev.steps.forEach(function(st, i){
      var vis = visible(st), isCur = (i === ci);
      var tk = taskByKey[st.task] || {label:"?", phase:""};
      var ph = phaseByKey[tk.phase] || {name:"", color:"var(--line)"};
      var row = document.createElement("div");
      row.className = "v-s" + (vis===false ? " skipped" : "") + (done[i] ? " done" : "") + (isCur ? " current" : "");
      row.style.setProperty("--pc", ph.color);
      if(vis !== false){ n++; total++; if(done[i]) fin++; }
      var mark = vis===false ? "&#8212;" : (done[i] ? "&#10003;" : n);

      var tags = "";
      if(isCur) tags += '<span class="tag now">現在</span>';
      if(st.sla) tags += '<span class="tag sla">SLA ' + esc(st.sla) + '</span>';
      if(st.escalate) tags += '<span class="tag esc">エスカレ判断</span>';
      (st.conditions||[]).forEach(function(c){
        tags += '<span class="tag cond">' + esc(condLabel(ev, c)) + ' のとき</span>';
      });

      row.innerHTML = '<div class="chk">' + mark + '</div><div class="bd">'
        + '<div class="ttl">' + esc(st.title) + tags + '</div>'
        + '<div class="path"><i>&#9679;</i> ' + esc(ph.name) + ' / ' + esc(tk.label) + '</div>'
        + '<div class="dsc">' + (vis===false ? "この対応では対象外です。" : (st.detail||"")) + '</div></div>';

      var chk = row.querySelector(".chk");
      if(vis !== false && !st.decision){
        chk.addEventListener("click", function(){ done[i] = !done[i]; save(); render(); });
      }
      var bd = row.querySelector(".bd");
      if(vis !== false && st.decision){
        var ask = document.createElement("div");
        ask.className = "v-ask";
        ask.innerHTML = '<p>' + esc(st.decision.label) + '</p><div class="opts"></div>';
        var opts = ask.querySelector(".opts");
        st.decision.options.forEach(function(o){
          var b = document.createElement("button");
          b.textContent = o.label;
          if(answers[st.decision.key] === o.value) b.className = "on";
          b.addEventListener("click", function(){
            answers[st.decision.key] = o.value; done[i] = true; save(); render();
          });
          opts.appendChild(b);
        });
        bd.appendChild(ask);
      }else if(isCur && vis !== false){
        var g = document.createElement("button");
        g.className = "v-godone"; g.textContent = "この手順を完了にする";
        g.addEventListener("click", function(){ done[i] = true; save(); render(); });
        bd.appendChild(g);
      }
      list.appendChild(row);
    });

    $("prog").textContent = fin + " / " + total;
    $("progbar").style.width = (total ? fin/total*100 : 0) + "%";
    paint(ev, ci);
  }

  function tick(){
    if(!startedAt) return;
    var s = Math.floor((Date.now()-startedAt)/1000);
    $("elapsed").textContent =
      String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
  }

  function select(key, restore){
    if(cur !== key){ answers = {}; done = {}; startedAt = Date.now(); }
    cur = key;
    Array.prototype.forEach.call(evlist.querySelectorAll(".v-ev"), function(b){
      b.classList.toggle("on", b.dataset.k === key);
    });
    if(!startedAt) startedAt = Date.now();
    if(!timer) timer = setInterval(tick, 1000);
    buildGrid(findEvent(key));
    render(); save(); tick();
  }

  $("reset").addEventListener("click", function(){
    answers = {}; done = {}; startedAt = Date.now(); save(); render(); tick();
  });
  $("copy").addEventListener("click", function(){
    var ev = findEvent(cur); if(!ev) return;
    var lines = ["■ " + ev.title + "（重大度 " + ev.severity + "）",
                 "経過: " + $("elapsed").textContent, ""];
    ev.steps.forEach(function(st){
      if(!st.decision) return;
      var a = answers[st.decision.key]; if(a === undefined) return;
      var l = a;
      st.decision.options.forEach(function(o){ if(o.value===a) l = o.label; });
      lines.push("判断: " + st.decision.label + " → " + l);
    });
    lines.push("");
    var n = 0;
    ev.steps.forEach(function(st, i){
      if(visible(st) === false){
        var why = (st.conditions||[]).map(function(c){ return condLabel(ev,c) + " のとき"; }).join(" かつ ");
        lines.push("  --  " + st.title + "（" + why + "／条件不一致のためスキップ）");
        return;
      }
      n++;
      lines.push("  " + (done[i] ? "[x]" : "[ ]") + " " + n + ". " + st.title + (st.sla ? "（SLA " + st.sla + "）" : ""));
    });
    var txt = lines.join("\n");
    var btn = $("copy"), old = btn.textContent;
    function ok(){ btn.textContent = "コピーしました"; setTimeout(function(){ btn.textContent = old; }, 1600); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok).catch(function(){ ok(); });
    }else{ ok(); }
  });

  var ro = new ResizeObserver(function(){ if(cur) render(); });
  ro.observe(grid);

  var boot = opt.event || (events[0] && events[0].key);
  if(KEY){
    try{
      var s = JSON.parse(localStorage.getItem(KEY) || "null");
      if(s && s.cur && findEvent(s.cur)){
        answers = s.answers || {}; done = s.done || {}; startedAt = s.startedAt || Date.now();
        boot = s.cur;
        select(boot, true);
        return { destroy: function(){ clearInterval(timer); ro.disconnect(); } };
      }
    }catch(e){}
  }
  if(boot) select(boot);
  return { destroy: function(){ clearInterval(timer); ro.disconnect(); } };
}
</script>

/* データ記述用のヘルパー（種データの整形だけに使う） */
function S(task,title,detail,sla,esc){
  return {id:nextId(), task:task, title:title, detail:detail||"", sla:sla||"",
          escalate:!!esc, conditions:[], decision:null};
}
function D(st,key,label,opts){
  st.decision={key:key,label:label,options:opts.map(function(o){return {value:o[0],label:o[1]};})};
  return st;
}
function C(st,key,value){ st.conditions.push({key:key,value:value}); return st; }
var _id=0; function nextId(){ return "s" + (++_id); }

/* ============ 状態 ============ */
var SKEY = "soc-flow-editor-mock/v3";
var DB, curEv = null, selStep = null, mode = "edit", viewer = null;
var palQ = "";
var UI = {wl:262, wr:336, ph:208};

var OPTC = ["#ffb02e","#4aa8ff","#ff5c8a","#2ee6a8","#a97bff","#5ad1e6"];
var PHC = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)",
           "var(--c6)","var(--c7)","var(--c8)","var(--c9)","var(--c10)"];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function load(){
  try{
    var s = JSON.parse(localStorage.getItem(SKEY) || "null");
    if(s && s.db && s.db.events && s.db.events.length){
      DB = s.db; _id = s.seq || 900;
      if(s.ui) UI = Object.assign(UI, s.ui);
      return;
    }
  }catch(e){}
  DB = seed();
}
function persist(){
  try{ localStorage.setItem(SKEY, JSON.stringify({db:DB, seq:_id, ui:UI})); }catch(e){}
}
function getEv(){ for(var i=0;i<DB.events.length;i++) if(DB.events[i].key===curEv) return DB.events[i]; return null; }
function task(k){ for(var i=0;i<DB.tasks.length;i++) if(DB.tasks[i].key===k) return DB.tasks[i]; return null; }
function phase(k){ for(var i=0;i<DB.phases.length;i++) if(DB.phases[i].key===k) return DB.phases[i]; return null; }
function phaseOfStep(st){ var t = task(st.task); return t ? phase(t.phase) : null; }
/* 列の最小幅。フェーズ数に応じて決めるので、列が減れば横スクロールも減る。 */
function gridMinWidth(){ var n = DB.phases.length; return (n*180 + (n-1)*40) + "px"; }

/* 判断ごとに色系統を割り当てる（分岐の見分けに使う） */
function decisionOf(evt, key){
  var n = 0;
  for(var i=0;i<evt.steps.length;i++){
    var d = evt.steps[i].decision;
    if(!d) continue;
    if(d.key === key) return {decision:d, index:n};
    n++;
  }
  return {decision:null, index:0};
}
function optLabel(evt, c){
  var d = decisionOf(evt, c.key).decision;
  if(!d) return c.value;
  for(var i=0;i<d.options.length;i++) if(d.options[i].value===c.value) return d.options[i].label;
  return c.value;
}
function optColor(evt, c){
  var r = decisionOf(evt, c.key);
  if(!r.decision) return "var(--dec)";
  var i = 0;
  r.decision.options.forEach(function(o, ix){ if(o.value===c.value) i = ix; });
  return OPTC[(i + r.index) % OPTC.length];
}

function phaseDist(evt){
  var m = {};
  evt.steps.forEach(function(s){ var t = task(s.task); if(t) m[t.phase] = (m[t.phase]||0) + 1; });
  return DB.phases.filter(function(p){ return m[p.key]; }).map(function(p){ return {p:p, n:m[p.key]}; });
}

        + '<button data-a="open">開く</button><button data-a="dup">複製</button>'
        + '<button data-a="exp">書き出し</button><button data-a="del" class="dg">削除</button></div>';
    card.addEventListener("click", function(e){

function openEvent(key){
  curEv = key; selStep = null;
  document.body.className = "screen-edit";
  mode = "edit";
  Array.prototype.forEach.call(document.querySelectorAll(".ed-modes button"), function(b){
    b.classList.toggle("on", b.dataset.mode === "edit"); });
  if(viewer){ viewer.destroy(); viewer = null; $("runRoot").innerHTML = ""; }
  applyUI();
  renderAll();
  requestAnimationFrame(renderCanvas);
}
function backToEvents(){
  if(viewer){ viewer.destroy(); viewer = null; $("runRoot").innerHTML = ""; }
  document.body.className = "screen-events";
  selStep = null;
  renderEventsScreen();
}
function newEvent(){
  var t = prompt("新しい事象の名称を入力してください。", "新しい事象");
  if(t === null) return;
  var k = "e" + Date.now().toString(36);
  DB.events.push({key:k, severity:"S2", title:t || "新しい事象", sub:"", steps:[]});
  persist(); openEvent(k);
}
function dupEvent(key){
  var e = DB.events.filter(function(x){ return x.key===key; })[0];
  var c = JSON.parse(JSON.stringify(e));
  c.key = "e" + Date.now().toString(36);
  c.title = e.title + "（複製）";
  c.steps.forEach(function(s){ s.id = nextId(); });
  DB.events.push(c); persist(); renderEventsScreen();
}
function delEvent(key){
  var e = DB.events.filter(function(x){ return x.key===key; })[0];
  if(DB.events.length < 2){ alert("最後の 1 件は削除できません。"); return; }
  if(!confirm("「" + e.title + "」を削除します。よろしいですか？")) return;
  DB.events = DB.events.filter(function(x){ return x.key !== key; });
  persist(); renderEventsScreen();
}

/* ---------- 手順アウトライン（左） ---------- */
function condKey(st){
  return (st.conditions||[]).map(function(c){ return c.key + "=" + c.value; }).sort().join("&");
}
function outlineRows(evt){
  var rows = [], prev = "";
  evt.steps.forEach(function(st, i){
    var k = condKey(st);
    if(k !== prev){
      if(k) rows.push({type:"grp", conds:(st.conditions||[]).slice()});
      prev = k;
    }
    rows.push({type:"step", st:st, i:i, deep:!!k});
  });
  return rows;
}
var dragStepId = null;
function renderOutline(){
  var evt = getEv(), box = $("olList");
  box.innerHTML = "";
  $("olCount").textContent = evt.steps.length + " 手順";
  if(!evt.steps.length){
    box.innerHTML = '<p class="ol-empty">手順がまだありません。<br>'
      + '下のタスクパレットから、キャンバスへドラッグしてください。</p>';
    return;
  }
  outlineRows(evt).forEach(function(r){
    if(r.type === "grp"){
      var col = optColor(evt, r.conds[0]);
      var g = document.createElement("div");
      g.className = "ol-grp"; g.style.setProperty("--oc", col);
      g.innerHTML = r.conds.map(function(c){ return esc(optLabel(evt, c)); }).join(" かつ ")
        + ' <u>のとき</u>';
      box.appendChild(g);
      return;
    }
    var st = r.st, p = phaseOfStep(st) || {color:"var(--line)"};
    var el = document.createElement("div");
    el.className = "ol-row" + (r.deep ? " d1" : "") + (st.decision ? " dec" : "")
      + (selStep === st.id ? " sel" : "");
    el.style.setProperty("--pc", p.color);
    el.draggable = true; el.dataset.id = st.id;
    var f = "";
    if(st.sla) f += '<span class="sla">' + esc(st.sla) + '</span>';
    if(st.escalate) f += '<span class="esc">!</span>';
    el.innerHTML = '<span class="ol-no">' + (r.i+1) + '</span><span class="ol-pc"></span>'
      + '<span class="ol-t">' + esc(st.title) + '</span><span class="ol-f">' + f + '</span>';
    el.addEventListener("click", function(){ selStep = st.id; renderAll(); scrollCanvasToSel(); });
    el.addEventListener("dragstart", function(e){
      dragStepId = st.id; el.classList.add("drag");
      e.dataTransfer.setData("text/plain", "step:" + st.id);
      e.dataTransfer.effectAllowed = "move";
    });
    el.addEventListener("dragend", function(){
      dragStepId = null; el.classList.remove("drag");
      Array.prototype.forEach.call(box.querySelectorAll(".ol-row"), function(x){ x.classList.remove("over"); });
    });
    el.addEventListener("dragover", function(e){ if(dragStepId){ e.preventDefault(); el.classList.add("over"); } });
    el.addEventListener("dragleave", function(){ el.classList.remove("over"); });
    el.addEventListener("drop", function(e){
      e.preventDefault(); e.stopPropagation();
      if(dragStepId) moveStep(dragStepId, st.id);
    });
    box.appendChild(el);
  });
  var lg = document.createElement("p");
  lg.className = "ol-legend";
  lg.innerHTML = "◆ 判断ステップ　／　字下げ＝その答えのときだけ実施する手順<br>"
    + "行をドラッグすると順序を入れ替えられます。";
  box.appendChild(lg);
}
function scrollCanvasToSel(){
  var el = $("cgrid").querySelector(".cnode.sel");
  if(el) el.scrollIntoView({behavior:"smooth", block:"nearest", inline:"nearest"});
}
function moveStep(fromId, beforeId){
  var evt = getEv();
  var fi = evt.steps.findIndex(function(s){ return s.id===fromId; });
  if(fi < 0 || fromId === beforeId) return;
  var moved = evt.steps.splice(fi, 1)[0];
  var ti = beforeId ? evt.steps.findIndex(function(s){ return s.id===beforeId; }) : -1;
  evt.steps.splice(ti < 0 ? evt.steps.length : ti, 0, moved);
  persist(); renderAll();
}

/* ---------- タスクパレット（中央・下） ----------
   列をキャンバスと揃えることで「このタスクはどの列に入るか」を自明にし、
   ドラッグ距離を最短（真上へ）にする。 */
function usageAll(k){
  var n = 0;
  DB.events.forEach(function(e){ if(e.steps.some(function(s){ return s.task===k; })) n++; });
  return n;
}
function usageHere(k){
  var e = getEv(); if(!e) return 0;
  return e.steps.filter(function(s){ return s.task===k; }).length;
}
function palCard(t, p){
  var here = usageHere(t.key), all = usageAll(t.key);
  var el = document.createElement("div");
  el.className = "pal-t"; el.draggable = true; el.dataset.k = t.key;
  el.style.setProperty("--pc", p.color);
  el.innerHTML = '<b>' + esc(t.label) + '</b><span class="nt">' + esc(t.note||"") + '</span>'
    + '<span class="use">' + (here ? '<span class="u-in">' + here + '</span>' : '')
    + '<span class="u-all">' + all + '</span></span>'
    + '<button class="add" title="末尾に追加">+</button>';
  el.title = t.label + (t.note ? "（" + t.note + "）" : "")
    + "\n この事象で " + here + " 回 / 全体で " + all + " 事象が使用";
  el.addEventListener("dragstart", function(e){
    e.dataTransfer.setData("text/plain", "task:" + t.key);
    e.dataTransfer.effectAllowed = "copy";
    el.classList.add("drag");
    document.body.classList.add("dragging");
    var col = $("cgrid").querySelector('.ccol[data-p="' + t.phase + '"]');
    if(col) col.classList.add("drop");
  });
  el.addEventListener("dragend", function(){
    el.classList.remove("drag");
    document.body.classList.remove("dragging");
    Array.prototype.forEach.call($("cgrid").querySelectorAll(".ccol"), function(c){ c.classList.remove("drop"); });
  });
  el.querySelector(".add").addEventListener("click", function(e2){ e2.stopPropagation(); addStep(t.key); });
  return el;
}
function renderPalette(){
  var grid = $("pgrid"); grid.innerHTML = "";
  grid.style.minWidth = gridMinWidth();
  var q = palQ.trim().toLowerCase(), hit = 0;
  DB.phases.forEach(function(p){
    var col = document.createElement("div");
    col.className = "pcol"; col.style.setProperty("--pc", p.color);
    col.innerHTML = '<h5>' + esc(p.name) + '</h5>';
    var ts = DB.tasks.filter(function(t){
      if(t.phase !== p.key) return false;
      if(!q) return true;
      return (t.label + " " + (t.note||"")).toLowerCase().indexOf(q) >= 0;
    });
    hit += ts.length;
    ts.forEach(function(t){ col.appendChild(palCard(t, p)); });
    if(!ts.length){
      var e0 = document.createElement("p");
      e0.className = "pcol-empty"; e0.textContent = q ? "該当なし" : "タスクなし";
      col.appendChild(e0);
    }
    var nb = document.createElement("button");
    nb.className = "pcol-new"; nb.textContent = "＋";
    nb.title = p.name + " に新しいタスクを作る";
    nb.addEventListener("click", function(){ newTask(p.key); });
    col.appendChild(nb);
    grid.appendChild(col);
  });
  $("palCount").textContent = q ? (hit + " / " + DB.tasks.length + " 件") : (DB.tasks.length + " 件");
}
function newTask(phaseKey){
  var p = phase(phaseKey);
  var label = prompt("「" + p.name + "」に追加するタスクの名称を入力してください。", "");
  if(!label) return;
  var note = prompt("補足（任意）", "") || "";
  DB.tasks.push({key:"t" + Date.now().toString(36), phase:phaseKey, label:label, note:note});
  persist(); renderPalette();
}

      var flags = "";

      if((st.conditions||[]).length) flags += '<span class="f-cond" title="表示条件あり">&#8888;</span>';
      if(st.escalate) flags += '<span class="f-esc" title="エスカレーション判断">!</span>';
      if(st.sla) flags += '<span class="f-sla">' + esc(st.sla) + '</span>';
      el.innerHTML = '<span class="num">' + (i+1) + '</span><span class="flags">' + flags + '</span>'
        + '<b>' + esc(st.title) + '</b><span class="tk">' + esc(t.label) + '</span>';
      el.addEventListener("click", function(){ selStep = st.id; renderAll(); });
      col.appendChild(el);
      nodes[i] = el;
    });
    var gh = document.createElement("div");
    gh.className = "ghost"; gh.textContent = "ここに入ります";
    col.appendChild(gh);
    grid.appendChild(col);
  });

  if(!evt.steps.length){
    var e0 = document.createElement("div");
    e0.className = "cempty";
    e0.innerHTML = '<b>まだ手順がありません</b>下のタスクパレットから、真上のフェーズ列へドラッグしてください。<br>'
      + '列への配置と接続線は自動で決まります。';
    grid.appendChild(e0);
  }
  requestAnimationFrame(function(){ paintEditorWires(nodes); });
}

function paintEditorWires(nodes){
  var grid = $("cgrid"), wires = $("cwires");
  var box = grid.getBoundingClientRect();
  wires.setAttribute("viewBox", "0 0 " + grid.clientWidth + " " + grid.clientHeight);
  var seq = nodes.filter(Boolean);
  if(seq.length < 2){ wires.innerHTML = ""; setHint(0); return; }

  function ortho(pts, r){
    var d = "M " + pts[0][0] + " " + pts[0][1];
    for(var i=1;i<pts.length-1;i++){
      var px=pts[i-1][0],py=pts[i-1][1],cx=pts[i][0],cy=pts[i][1],nx=pts[i+1][0],ny=pts[i+1][1];
      var v1x=cx-px,v1y=cy-py,v2x=nx-cx,v2y=ny-cy;
      var l1=Math.hypot(v1x,v1y)||1,l2=Math.hypot(v2x,v2y)||1,rr=Math.min(r,l1/2,l2/2);
      d += " L " + (cx-v1x/l1*rr) + " " + (cy-v1y/l1*rr);
      d += " Q " + cx + " " + cy + " " + (cx+v2x/l2*rr) + " " + (cy+v2y/l2*rr);
    }
    return d + " L " + pts[pts.length-1][0] + " " + pts[pts.length-1][1];
  }
  var maxBottom = 0;
  seq.forEach(function(el){ maxBottom = Math.max(maxBottom, el.getBoundingClientRect().bottom - box.top); });

  /* 同じ列の 2 つのボックスの間に線を通せるすき間があれば、その y を返す。
     無ければ null（＝下の迂回路を使う）。ビューア側と同じ規則。 */
  function gapLane(a, b){
    var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    if(Math.abs(ra.left - rb.left) > 2) return null;
    var up = ra.top < rb.top ? ra : rb, low = ra.top < rb.top ? rb : ra;
    var gap = low.top - up.bottom;
    if(gap < 12) return null;
    var y = up.bottom + gap/2 - box.top;
    for(var i=0;i<seq.length;i++){
      var el = seq[i];
      if(el === a || el === b) continue;
      var r = el.getBoundingClientRect();
      if(Math.abs(r.left - ra.left) > 2) continue;
      if(r.top - box.top < y && r.bottom - box.top > y) return null;
    }
    return y;
  }

  var out = '<defs><marker id="eah" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="7" markerHeight="6"'
    + ' orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6478"/></marker></defs>';
  var back = 0;
  for(var k=0;k<seq.length-1;k++){
    var ra = seq[k].getBoundingClientRect(), rb = seq[k+1].getBoundingClientRect();
    var x1 = ra.right - box.left, y1 = ra.top - box.top + ra.height/2;
    var x2 = rb.left - box.left - 7, y2 = rb.top - box.top + rb.height/2;
    var d;
    if(x2 > x1 + 10){
      var dx = Math.max(24, (x2-x1)*0.45);
      d = "M " + x1 + " " + y1 + " C " + (x1+dx) + " " + y1 + ", " + (x2-dx) + " " + y2 + ", " + x2 + " " + y2;
    }else{
      var gx = Math.min(grid.clientWidth-6, x1+24), hx = Math.max(-10, x2-24);
      var gy = gapLane(seq[k], seq[k+1]);
      if(gy !== null){
        d = ortho([[x1,y1],[gx,y1],[gx,gy],[hx,gy],[hx,y2],[x2,y2]], 9);
      }else{
        var ch = maxBottom + 20 + back*12; back++;
        d = ortho([[x1,y1],[gx,y1],[gx,ch],[hx,ch],[hx,y2],[x2,y2]], 10);
      }
    }
    out += '<path d="' + d + '" stroke="#5b6478" fill="none" stroke-width="1.8" opacity="0.5"'
      + ' marker-end="url(#eah)"/>';
  }
  wires.innerHTML = out;
  setHint(back);
}
/* ここで数えているのは「下の迂回路を通った線」。
   検証モーダルの「前のフェーズへの後戻り」とは別の指標なので文言を分けてある。 */
function setHint(back){
  var h = $("canvHint");
  h.textContent = back > 5 ? "迂回する線が " + back + " 本 — 並び順を見直してください"
                           : "下のパレットからドラッグして投入";
  h.style.color = back > 5 ? "var(--s2)" : "";
}

function priorDecisions(evt, stepId){
  var out = [], hit = false;
  for(var i=0;i<evt.steps.length;i++){
    if(evt.steps[i].id === stepId){ hit = true; break; }
    if(evt.steps[i].decision) out.push(evt.steps[i].decision);
  }
  return hit ? out : [];
}

/* ============ 検証・経路 ============ */
function parseSla(s){
  if(!s) return 0;
  if(/即時/.test(s)) return 0;
  var m = String(s).match(/(\d+(?:\.\d+)?)/);
  var n = m ? parseFloat(m[1]) : 0;
  if(/営業日|日/.test(s)) return n * 8 * 60;
  if(/時間/.test(s)) return n * 60;
  return n;
}
function fmtMin(m){
  if(m < 60) return m + " 分";
  var h = Math.floor(m/60), r = Math.round(m%60);
  return h + " 時間" + (r ? " " + r + " 分" : "");
}
function enumeratePaths(evt){
  var results = [];
  function vis(st, ans){
    var cs = st.conditions || [];
    for(var j=0;j<cs.length;j++){
      if(ans[cs[j].key] === undefined) return false;
      if(ans[cs[j].key] !== cs[j].value) return false;
    }
    return true;
  }
  function walk(i, ans){
    if(results.length >= 64) return;
    for(; i<evt.steps.length; i++){
      var st = evt.steps[i];
      if(!vis(st, ans)) continue;
      if(st.decision){
        st.decision.options.forEach(function(o){
          var a2 = Object.assign({}, ans); a2[st.decision.key] = o.value;
          walk(i+1, a2);
        });
        return;
      }
    }
    results.push(ans);
  }
  walk(0, {});
  return results.map(function(ans){
    var steps = evt.steps.filter(function(st){ return vis(st, ans); });
    return {answers:ans, count:steps.length,
            minutes:steps.reduce(function(a,s){ return a + parseSla(s.sla); }, 0)};
  });
}
function validate(evt){
  var issues = [], seen = {};
  evt.steps.forEach(function(st, i){
    (st.conditions||[]).forEach(function(c){
      if(!seen[c.key]) issues.push({lv:"err",
        t:"手順 " + (i+1) + "「" + st.title + "」の条件が、まだ現れていない判断を参照しています",
        d:"参照キー: " + c.key + " — この判断はこの手順より後ろにあるか、存在しません。"
          + "対応者は、まだ答えていない質問の結果で分岐させられません。"});
    });
    if(st.decision) seen[st.decision.key] = true;
  });
  var paths = enumeratePaths(evt);
  evt.steps.forEach(function(st, i){
    if(!(st.conditions||[]).length) return;
    var reachable = paths.some(function(p){
      return st.conditions.every(function(c){ return p.answers[c.key] === c.value; }); });
    if(!reachable) issues.push({lv:"wrn",
      t:"手順 " + (i+1) + "「" + st.title + "」はどの経路でも表示されません",
      d:"条件の組み合わせが成立しません。条件を見直すか、手順を削除してください。"});
  });
  evt.steps.forEach(function(st){
    if(!st.decision) return;
    var refs = evt.steps.filter(function(s){
      return (s.conditions||[]).some(function(c){ return c.key === st.decision.key; }); });
    if(!refs.length) issues.push({lv:"wrn",
      t:"判断「" + st.decision.label + "」の答えが、どの手順にも使われていません",
      d:"回答しても何も変わりません。分岐が不要なら、判断ステップを解除できます。"});
  });
  var back = 0, order = DB.phases.map(function(p){ return p.key; });
  for(var i=1;i<evt.steps.length;i++){
    var a = task(evt.steps[i-1].task), b = task(evt.steps[i].task);
    if(a && b && order.indexOf(b.phase) < order.indexOf(a.phase)) back++;
  }
  if(back > 5) issues.push({lv:"wrn", t:"前のフェーズへの後戻りが " + back + " 回あります",
    d:"接続線が混み、図が読みにくくなります。線を整える前に、フロー自体の並び順を見直してください。"});
  return {issues:issues, paths:paths, back:back};
}

  var r = validate(getEv()), b = $("btnCheck");

  b.textContent = r.issues.length ? "検証 " + r.issues.length + " 件" : "検証 OK";
}

}

/* ---------- フェーズ設定 ----------
   フェーズ名は組織ごとに違うので、画面から並べ替え・改名・追加・削除できるようにする。 */
function showPhases(){
  function body(){
    var rows = DB.phases.map(function(p, i){
      var n = DB.tasks.filter(function(t){ return t.phase===p.key; }).length;
      return '<tr>'
        + '<td class="num">' + (i+1) + '</td>'
        + '<td><div class="ph-mv">'
          + '<button data-up="' + i + '"' + (i===0?" disabled":"") + '>&#9650;</button>'
          + '<button data-dn="' + i + '"' + (i===DB.phases.length-1?" disabled":"") + '>&#9660;</button>'
          + '</div></td>'
        + '<td><input class="ph-name" data-nm="' + i + '" value="' + esc(p.name) + '"></td>'
        + '<td><div class="ph-sw">' + PHC.map(function(c){
            return '<button data-col="' + i + '" data-c="' + c + '" style="background:' + c + '"'
              + (p.color===c ? ' class="on"' : '') + '></button>'; }).join("") + '</div></td>'
        + '<td class="num">' + n + '</td>'
        + '<td><button class="ed-tool sm" data-del="' + i + '"' + (n ? " disabled" : "") + '>削除</button></td>'
        + '</tr>';
    }).join("");
    return '<p class="ins hint" style="margin:0 0 12px">'
      + '<b style="color:var(--dim)">フェーズは「対応の段階」です。</b>'
      + '時間とともに一方向に進むものを列にしてください。<br>'
      + '「判断」「エスカレーション」のようにどの段階でも起こりうる作業は、'
      + '列ではなく手順の属性（◆ / !）で表現されます。</p>'
      + '<table class="tbl"><thead><tr><th>#</th><th>並び</th><th>名称</th><th>色</th>'
      + '<th>タスク</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
      + '<div class="ph-preview">' + DB.phases.map(function(p){
          return '<em style="--pc:' + p.color + '">' + esc(p.name) + '</em>'; }).join('<i>&#8594;</i>')
      + '</div>'
      + '<p class="ins hint">タスクが割り当てられているフェーズは削除できません。'
      + '先にタスクを別のフェーズへ移すか、削除してください。</p>';
  }
  function open(){
    openModal("フェーズ設定", "フロー図の列 — " + DB.phases.length + " 段階", body(),
      '<div class="fnote">変更はすべての事象に反映されます。</div>'
      + '<button class="ed-tool" id="ph_add">＋ フェーズを追加</button>'
      + '<button class="ed-tool" onclick="closeModal()">閉じる</button>');
    var b = $("mBody");
    function refresh(){ persist(); open(); repaintAll(); }
    Array.prototype.forEach.call(b.querySelectorAll("[data-up]"), function(x){
      x.addEventListener("click", function(){
        var i = +this.dataset.up;
        DB.phases.splice(i-1, 0, DB.phases.splice(i,1)[0]); refresh();
      });
    });
    Array.prototype.forEach.call(b.querySelectorAll("[data-dn]"), function(x){
      x.addEventListener("click", function(){
        var i = +this.dataset.dn;
        DB.phases.splice(i+1, 0, DB.phases.splice(i,1)[0]); refresh();
      });
    });
    Array.prototype.forEach.call(b.querySelectorAll("[data-nm]"), function(x){
      x.addEventListener("change", function(){
        DB.phases[+this.dataset.nm].name = this.value || "（無名）"; refresh();
      });
    });
    Array.prototype.forEach.call(b.querySelectorAll("[data-col]"), function(x){
      x.addEventListener("click", function(){
        DB.phases[+this.dataset.col].color = this.dataset.c; refresh();
      });
    });
    Array.prototype.forEach.call(b.querySelectorAll("[data-del]"), function(x){
      x.addEventListener("click", function(){
        var i = +this.dataset.del;
        if(DB.phases.length < 2){ alert("最後の 1 つは削除できません。"); return; }
        if(!confirm("フェーズ「" + DB.phases[i].name + "」を削除します。よろしいですか？")) return;
        DB.phases.splice(i, 1); refresh();
      });
    });
    $("ph_add").addEventListener("click", function(){
      var name = prompt("追加するフェーズの名称を入力してください。", "");
      if(!name) return;
      var used = DB.phases.map(function(p){ return p.color; });
      var col = PHC.filter(function(c){ return used.indexOf(c) < 0; })[0] || PHC[0];
      DB.phases.push({key:"p" + Date.now().toString(36), name:name, color:col});
      refresh();
    });
  }
  open();
}
function repaintAll(){
  if(document.body.classList.contains("screen-events")) renderEventsScreen();
  else if(document.body.classList.contains("screen-edit")) renderAll();
}

/* ============ 書き出し ============ */
function buildExportHTML(events, title){
  var css = document.getElementById("viewerCss").textContent;
  var js  = document.getElementById("viewerJs").textContent;
  var data = {phases:DB.phases, tasks:DB.tasks, events:events};
  var json = JSON.stringify(data).replace(/</g, "\\u003c");
  return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>' + esc(title) + '</title>\n<style>' + css + '</style>\n</head>\n<body>\n'
    + '<div id="root"></div>\n<script>\n' + js + '\nvar DATA=' + json + ';\n'
    + 'mountViewer(document.getElementById("root"), DATA, {storageKey:"soc-flow-run/"+location.pathname});\n'
    + '<\/script>\n</body>\n</html>\n';
}
function kb(s){ return (new Blob([s]).size / 1024).toFixed(0) + " KB"; }
function showExport(){
  var evt = getEv();
  var all = buildExportHTML(DB.events, "SOC 対応フロー");
  var one = evt ? buildExportHTML([evt], evt.title + " — SOC 対応フロー") : null;
  openModal("書き出し", "対応者に配る単一 HTML",
    '<p class="ins hint" style="margin:0 0 12px">下のプレビューは、実際に書き出される HTML を'
    + 'そのまま表示しています。外部依存はありません。ファイルをコピーするだけで配れます。</p>'
    + '<iframe class="frame" id="expFrame"></iframe>',
    '<div class="fnote">' + (one ? 'この事象のみ: ' + kb(one) + '　／　' : '')
      + '全 ' + DB.events.length + ' 事象: ' + kb(all) + '</div>'
    + (one ? '<button class="ed-tool" id="dl1">この事象を保存</button>' : '')
    + '<button class="ed-tool pri" id="dlAll">全事象を保存</button>'
    + '<button class="ed-tool" onclick="closeModal()">閉じる</button>');
  $("expFrame").srcdoc = one || all;
  if(one) $("dl1").addEventListener("click", function(){ download(one, "soc-flow-" + evt.key + ".html"); });
  $("dlAll").addEventListener("click", function(){ download(all, "soc-flow-all.html"); });
}
function download(text, name){
  var b = new Blob([text], {type:"text/html;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* ============ モード ============ */
function setMode(m){
  mode = m;
  Array.prototype.forEach.call(document.querySelectorAll(".ed-modes button"), function(b){
    b.classList.toggle("on", b.dataset.mode === m); });
  document.body.className = (m === "run") ? "screen-run" : "screen-edit";
  if(m === "run"){
    if(viewer) viewer.destroy();
    /* 試走の進捗は保存しない（storageKey を渡さない）＝編集の下書きを汚さない */
    viewer = mountViewer($("runRoot"), {phases:DB.phases, tasks:DB.tasks, events:DB.events},
      {event:curEv, note:"提案用モックです。内容はダミーで、実運用の手順ではありません。"});
  }else{
    if(viewer){ viewer.destroy(); viewer = null; }
    $("runRoot").innerHTML = "";
    renderAll();
    requestAnimationFrame(renderCanvas);
  }
}

/* ============ レイアウト ============ */
function applyUI(){
  var b = $("edBody");
  b.style.setProperty("--wl", UI.wl + "px");
  b.style.setProperty("--wr", UI.wr + "px");
  $("palbar").style.setProperty("--ph", UI.ph + "px");
}
function initSplits(){
  Array.prototype.forEach.call(document.querySelectorAll(".split"), function(sp){
    sp.addEventListener("mousedown", function(e){
      e.preventDefault();
      var t = sp.dataset.target, x0 = e.clientX, y0 = e.clientY;
      var wl0 = UI.wl, wr0 = UI.wr, ph0 = UI.ph;
      document.body.classList.add("resizing");
      if(t === "palbar") document.body.classList.add("rows");
      function mv(ev){
        if(t === "left")       UI.wl = Math.max(190, Math.min(480, wl0 + (ev.clientX - x0)));
        else if(t === "right") UI.wr = Math.max(270, Math.min(560, wr0 - (ev.clientX - x0)));
        else                   UI.ph = Math.max(90,  Math.min(460, ph0 - (ev.clientY - y0)));
        applyUI();
      }
      function up(){
        document.removeEventListener("mousemove", mv);
        document.removeEventListener("mouseup", up);
        document.body.classList.remove("resizing", "rows");
        persist(); renderCanvas();
      }
      document.addEventListener("mousemove", mv);
      document.addEventListener("mouseup", up);
    });
  });
}
/* キャンバスとパレットの横スクロールを同期させ、列を常に揃える */
function syncScroll(a, b){
  var lock = false;
  a.addEventListener("scroll", function(){
    if(lock) return;
    lock = true; b.scrollLeft = a.scrollLeft;
    requestAnimationFrame(function(){ lock = false; });
  });
}

/* ============ 全体描画 ============ */
function renderAll(){
  if(!getEv()) return;
  renderHeader(); renderOutline(); renderPalette(); renderCanvas();
  renderInspector(); renderCheckBadge();
}

/* ============ 配線 ============ */
$("ewPhases").addEventListener("click", showPhases);
$("ewTasks").addEventListener("click", showTasks);
$("ewExportAll").addEventListener("click", function(){ curEv = null; showExport(); });
$("btnBack").addEventListener("click", backToEvents);
$("btnCheck").addEventListener("click", showCheck);
$("btnPaths").addEventListener("click", showPaths);
$("btnExport").addEventListener("click", showExport);
$("mClose").addEventListener("click", closeModal);
$("mask").addEventListener("click", function(e){ if(e.target === $("mask")) closeModal(); });

$("palSearch").addEventListener("input", function(){ palQ = this.value; renderPalette(); });
$("palFold").addEventListener("click", function(){
  var f = document.body.classList.toggle("palfold");
  this.textContent = f ? "▴" : "▾";
  this.title = f ? "開く" : "折りたたむ";
  requestAnimationFrame(renderCanvas);
});
$("canvas").addEventListener("dragover", function(e){ e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
$("canvas").addEventListener("drop", function(e){
  e.preventDefault();
  var d = e.dataTransfer.getData("text/plain") || "";
  if(d.indexOf("task:") === 0) addStep(d.slice(5));
});
$("olList").addEventListener("dragover", function(e){ if(dragStepId) e.preventDefault(); });
$("olList").addEventListener("drop", function(e){
  e.preventDefault();
  if(dragStepId) moveStep(dragStepId, null);
});
syncScroll($("canvas"), $("palscroll"));
syncScroll($("palscroll"), $("canvas"));
Array.prototype.forEach.call(document.querySelectorAll(".ed-modes button"), function(b){
  b.addEventListener("click", function(){ setMode(b.dataset.mode); });
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if($("mask").classList.contains("on")){ closeModal(); return; }
  if(document.body.classList.contains("screen-edit")){
    if(selStep){ selStep = null; renderAll(); } else backToEvents();
  }
});
window.addEventListener("resize", function(){
  if(document.body.classList.contains("screen-edit")) renderCanvas();
});

load();
initSplits();
renderEventsScreen();
</script>
</body>
</html>
