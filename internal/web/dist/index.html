<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Workflow</title>
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="screen-events">

<!-- ================= 事象ウィンドウ ================= -->
<div id="scEvents">
  <div class="ew-top">
    <h1 class="brand">SOC <b>Workflow</b></h1>
    <div class="ed-spacer"></div>
    <button class="ed-tool" data-th type="button"></button>
    <button class="ed-tool" id="ewLanes">担当設定</button>
    <button class="ed-tool" id="ewPhases">段階設定</button>
    <button class="ed-tool" id="ewTasks">タスク一覧</button>
    <button class="ed-tool" id="ewContacts">連絡先</button>
    <button class="ed-tool" id="ewExportAll">全事象を書き出し</button>
  </div>
  <div class="ew-body">
    <h2 class="ew-h">発生しうる事象 <span id="ewCount"></span></h2>
    <div class="ew-grid" id="ewGrid"></div>
    <p class="ed-note" id="ewNote"></p>
  </div>
</div>

<!-- ================= 編集ビュー ================= -->
<div id="scEdit">

  <div class="ed-top">
    <button class="ed-back" id="btnBack">← 事象一覧</button>
    <div class="ed-title" id="edTitle"></div>
    <div class="ed-spacer"></div>
    <button class="ed-tool" data-th type="button"></button>
    <button class="ed-tool" id="btnCheck">検証</button>
    <button class="ed-tool" id="btnPaths">経路一覧</button>
    <div class="ed-modes">
      <button data-mode="edit" class="on">編集</button>
      <button data-mode="run">試走</button>
    </div>
    <button class="ed-tool pri" id="btnExport">書き出し</button>
  </div>

  <div class="ed-body" id="edBody">

    <div class="pane">
      <h3>手順アウトライン <span id="olCount"></span></h3>
      <div class="scroll" id="olList"></div>
    </div>

    <div class="split" data-target="left"></div>

    <div class="pane">
      <h3>フローキャンバス <span id="canvHint">右のタスクパレットからドラッグして投入</span></h3>
      <div class="canvas" id="canvas">
        <div class="cgrid" id="cgrid"><svg class="cwires" id="cwires"></svg></div>
      </div>
    </div>

    <div class="split" data-target="right"></div>

    <!-- 右: インスペクタ ⇄ タスクパレット をタブで切り替える -->
    <div class="pane tab-ins" id="paneRight">
      <div class="tabs">
        <button data-tab="ins" class="on">インスペクタ<i id="tabInsNo"></i></button>
        <button data-tab="pal">タスクパレット<i id="tabPalNo"></i></button>
      </div>
      <div class="scroll ins" id="insScroll">
        <div class="savewarn" id="insWarn"></div>
        <div id="ins"></div>
      </div>
      <div class="palwrap" id="palwrap">
        <input class="pal-search" id="palSearch" type="text" placeholder="タスクを検索…">
        <div class="tools">
          <select id="palSort" title="並び順">
            <option value="use">使用の多い順</option>
            <option value="def">定義順</option>
            <option value="name">名前順</option>
          </select>
          <select id="palFilter" title="絞り込み">
            <option value="all">すべて</option>
            <option value="here">この事象で使用中</option>
            <option value="unused">未使用</option>
          </select>
        </div>
        <div id="palList"></div>
        <button class="pal-new" id="palNew">＋ 新しいタスクを作る</button>
      </div>
    </div>

  </div>

  <div id="runWrap">
    <div class="runbar">
      <b>試走モード</b> — 対応者と同じ画面です。ここで見えているものが、そのまま書き出される単一 HTML になります。
      ここで付けた進捗と回答は、編集モードに戻ると破棄されます。
    </div>
    <div id="runRoot"></div>
  </div>

</div>

<!-- 通知・モーダル -->
<div class="toast" id="toast"></div>
<div class="mask" id="mask">
  <div class="modal">
    <header>
      <h2 id="mTitle">タイトル<small id="mSub"></small></h2>
      <button class="xbtn" id="mClose">×</button>
    </header>
    <div class="mbody" id="mBody"></div>
    <footer id="mFoot"></footer>
  </div>
</div>

<!-- viewer は書き出し HTML と同じものを、素の script として先に読む。
     モジュールにすると書き出し側で使えなくなるため（web/src/viewer.d.ts）。 -->
<script src="viewer.js"></script>
<script src="app.js"></script>
</body>
</html>
